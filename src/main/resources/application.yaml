spring:
  application:
    name: ifs25055-pbo2026-springboot-cashflow

server:
  port: 8081
  servlet:
    context-path: /
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 512
    mime-types: text/html,text/css,text/plain,application/javascript,text/javascript,application/json,image/svg+xml
  tomcat:
    internal-proxies: .*
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto