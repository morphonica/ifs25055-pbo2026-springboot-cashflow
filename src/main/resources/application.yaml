spring:
  application:
    name: ifs25055-pbo2026-springboot-cashflow

server:
  port: 8081
  servlet:
    context-path: /
  forward-headers-strategy: framework
  compression:
    enabled: false
  tomcat:
    internal-proxies: .*
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto