spring:
  application:
    name: ifs25055-pbo2026-springboot-cashflow
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}
  forward-headers-strategy: native

vaadin:
  launch-browser: false
  liveReload:
    enabled: true